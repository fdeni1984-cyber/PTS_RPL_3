<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Peserta</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <h1>Edit Data Peserta</h1>
    <form id="formEdit">
        <label for="nama">Nama :</label>
        <input type="text" id="nama" placeholder="Nama Lengkap">
        <br><br>

        <label for="email">Email :</label>
        <input type="email" id="email" placeholder="Email">
        <br><br>

        <label for="noHp">No HP :</label>
        <input type="text" id="noHp" placeholder="No HP">
        <br><br>

        <select name="pilih jurusan" id="jurusan">
            <option value="" selected disabled>Pilih Jurusan</option>
            <option value="RPL">RPL</option>
            <option value="TKJ">TKJ</option>
            <option value="PF">PF</option>
            <option value="TJA">TJA</option>
        </select>

        <select name="pilih kegiatan" id="kegiatan">
            <option value="" selected disabled>Pilih Kegiatan</option>
            <option value="Seminar">Seminar</option>
            <option value="Workshop">Workshop</option>
            <option value="Lomba">Lomba</option>
            <option value="Pelatihan">Pelatihan</option>
        </select>

        <br><br>
        <div class="tombol">
            <a href="./dashboard.html">
                <button type="button">Batal</button>
            </a>
            <button type="submit" id="tombolSimpanEdit">Simpan Perubahan</button>
        </div>
    </form>

    <script src="../js/script.js"></script>
</body>
</html>
